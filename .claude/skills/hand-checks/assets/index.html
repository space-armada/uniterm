<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uniterm hand checks</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcd8;
    --accent: #2f5fd0; --code: #efefeb;
    --pass: #1f7a3d; --changes: #a86400; --fail: #b3261e; --blocked: #5b5b66;
    --pass-bg: #e3f3e8; --changes-bg: #fbefd9; --fail-bg: #fbe3e1; --blocked-bg: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a; --panel: #222225; --ink: #ececee; --muted: #a0a0a8; --line: #38383d;
      --accent: #7ea2ff; --code: #2e2e33;
      --pass: #6fd08f; --changes: #f2b45a; --fail: #ff8a80; --blocked: #b0b0bc;
      --pass-bg: #1d3426; --changes-bg: #3a2c15; --fail-bg: #3d1f1d; --blocked-bg: #2e2e35;
    }
  }
  *, *::before, *::after { box-sizing: border-box; min-width: 0; }
  input, textarea, select { font-size: max(16px, 1rem); }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
         background: var(--bg); color: var(--ink); }
  code { font: 13px ui-monospace, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; }
  a { color: var(--accent); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  select, input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

  .app { display: grid; grid-template-columns: 330px 1fr; height: 100svh; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); display: flex; flex-direction: column; }
  main { overflow-y: auto; }

  .side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .side-head h1 { font-size: 16px; margin: 0; }
  .side-head label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .progress { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }

  .group { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .group-title { padding: 6px 14px 2px; font-weight: 600; font-size: 13px; }
  .milestone { padding: 4px 14px 0 14px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .item { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; border: 0; border-radius: 0;
          background: none; padding: 5px 14px 5px 22px; font-size: 13px; }
  .item:hover { background: var(--bg); }
  .item[aria-current=true] { background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; border: 1.5px solid var(--muted); }
  .dot.pass { background: var(--pass); border-color: var(--pass); }
  .dot.changes { background: var(--changes); border-color: var(--changes); }
  .dot.fail { background: var(--fail); border-color: var(--fail); }
  .dot.blocked { background: var(--blocked); border-color: var(--blocked); }

  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; white-space: nowrap; }
  .chip.pass { background: var(--pass-bg); color: var(--pass); }
  .chip.changes { background: var(--changes-bg); color: var(--changes); }
  .chip.fail { background: var(--fail-bg); color: var(--fail); }
  .chip.blocked { background: var(--blocked-bg); color: var(--blocked); }
  .chip.open { background: var(--code); color: var(--muted); }
  .chip.need { background: var(--code); color: var(--ink); }

  .toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 28px; border-bottom: 1px solid var(--line);
             background: var(--panel); position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
  .toolbar .stamp { font-size: 12px; color: var(--muted); margin-right: auto; }
  .content { max-width: 820px; padding: 22px 28px 60px; }
  .content h2 { font-size: 22px; line-height: 1.25; margin: 4px 0 6px; }
  .content h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 6px; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  ol, ul { padding-left: 22px; margin: 0; }
  li { margin: 4px 0; }
  .expected label { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; }
  .expected input { margin-top: 4px; }
  .notes-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .launch { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .launch code { flex: 1; overflow-x: auto; white-space: nowrap; padding: 6px 8px; }

  .verdict { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 26px; display: grid; gap: 12px; }
  .verdicts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .verdicts button { padding: 9px 6px; font-weight: 600; }
  .verdicts button[aria-pressed=true].pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
  .verdicts button[aria-pressed=true].changes { background: var(--changes-bg); color: var(--changes); border-color: var(--changes); }
  .verdicts button[aria-pressed=true].fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
  .verdicts button[aria-pressed=true].blocked { background: var(--blocked-bg); color: var(--blocked); border-color: var(--blocked); }
  .verdict textarea { width: 100%; min-height: 110px; resize: vertical; }
  .verdict .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); }
  .warn { font-size: 13px; color: var(--changes); }
  .shots { display: flex; gap: 10px; flex-wrap: wrap; }
  .shot { position: relative; }
  .shot img { height: 110px; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .shot button { position: absolute; top: 4px; right: 4px; padding: 0 6px; font-size: 12px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .nav { display: flex; justify-content: space-between; margin-top: 20px; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  .toast.show { opacity: 1; }
  .banner { background: var(--fail-bg); color: var(--fail); padding: 8px 28px; font-size: 13px; }
  .summary textarea { width: 100%; min-height: 60vh; font: 12px ui-monospace, Menlo, monospace; }
  .empty { padding: 60px 28px; color: var(--muted); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; } aside { max-height: 45vh; } }
</style>
<script src="checks.js"></script>
<script src="stamp.js" onerror="window.UHC_STAMPS = window.UHC_STAMPS || []"></script>
</head>
<body>
<div class="app">
  <aside aria-label="Checks">
    <div class="side-head">
      <h1>uniterm hand checks</h1>
      <label>Your name, as it should appear in results
        <input type="text" id="tester" autocomplete="name" placeholder="Name or handle">
      </label>
      <label>Assigned proposal
        <select id="filter"></select>
      </label>
      <div class="progress" id="progress"></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
    </div>
    <nav id="list"></nav>
  </aside>
  <main>
    <div id="banner" class="banner" hidden></div>
    <div class="toolbar">
      <span class="stamp" id="stamp"></span>
      <button type="button" id="reload" title="Reload to pick up a new build stamp. Your results are kept.">Reload stamp</button>
      <button type="button" id="summary">Summary</button>
      <button type="button" id="import">Import results</button>
      <button type="button" id="export">Export results</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "uhc-results-v1";
  var VERDICTS = [
    { key: "pass", label: "Pass", help: "It works as expected." },
    { key: "changes", label: "Pass with changes", help: "It works, but I would like something different." },
    { key: "fail", label: "Fail", help: "It is broken. Say which step and what happened." },
    { key: "blocked", label: "Couldn't run", help: "Missing hardware, setup failed, or the check did not apply." }
  ];
  var SEVERITY = { fail: 4, changes: 3, blocked: 2, pass: 1 };
  var NEED_LABELS = {
    "network": "network", "second-display": "second display", "physical-mouse": "mouse with back/forward",
    "trackpad": "trackpad", "voiceover": "VoiceOver", "ssh-host": "ssh host", "docker": "Docker",
    "web-account": "website account", "finder": "Finder", "keychain": "Keychain", "xcode": "Xcode app", "pages": "Pages"
  };
  var LAUNCH_LABELS = {
    "isolated": "fresh state each launch", "isolated-persistent": "state kept across launches",
    "real": "your real settings and data", "none": "no app launch"
  };

  var checks = window.UHC_CHECKS || [];
  var stamps = window.UHC_STAMPS || [];
  var byId = {};
  checks.forEach(function (c) { byId[c.id] = c; });

  var state = load();
  var currentId = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && parsed.results) return parsed;
    } catch (e) { /* fall through to a fresh state */ }
    return { tester: "", filter: "", results: {} };
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      banner("");
    } catch (e) {
      banner("The browser refused to save: its storage for this page is full, most likely from screenshots. " +
             "Export your results now, then remove some screenshots.");
    }
  }

  function banner(text) {
    var el = document.getElementById("banner");
    el.textContent = text;
    el.hidden = !text;
  }

  var toastTimer = null;
  function toast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3200);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // The guides use a small markdown subset: `code`, **bold**, and [text](http...) links.
  // `<bundle>` in a guide names this folder. The page knows where it is, so it shows the real path.
  function inline(s) {
    var parts = String(s).split("<bundle>").join(shellQuote(bundleDir())).split(/(`[^`]*`)/);
    return parts.map(function (part) {
      if (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`") {
        return "<code>" + esc(part.slice(1, -1)) + "</code>";
      }
      var out = esc(part);
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (_, text, url) {
        return '<a href="' + url + '" target="_blank" rel="noreferrer">' + text + "</a>";
      });
      return out;
    }).join("");
  }

  function el(tag, attrs, html) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    if (html !== undefined) node.innerHTML = html;
    return node;
  }

  function bundleDir() {
    var path = decodeURIComponent(location.pathname);
    return path.slice(0, path.lastIndexOf("/"));
  }

  function shellQuote(s) {
    return /^[A-Za-z0-9_\/.\-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'";
  }

  function launchCommand(id) {
    return shellQuote(bundleDir() + "/scripts/launch.sh") + " " + id;
  }

  function latestStamp(id) {
    for (var i = stamps.length - 1; i >= 0; i--) {
      if (stamps[i].check === id) return stamps[i];
    }
    return null;
  }

  function stampText(s) {
    if (!s) return "";
    return s.commit.slice(0, 12) + " on " + s.branch + (s.dirtyFiles ? " (" + s.dirtyFiles + " modified files)" : "") +
      ", macOS " + s.macos + ", " + s.time.replace("T", " ").replace("Z", " UTC");
  }

  function visibleChecks() {
    return checks.filter(function (c) { return !state.filter || c.proposal === state.filter; });
  }

  function resultOf(id) { return state.results[id] || null; }

  function rollup(list) {
    var worst = null, done = 0;
    list.forEach(function (c) {
      var r = resultOf(c.id);
      if (r && r.verdict) {
        done++;
        if (!worst || SEVERITY[r.verdict] > SEVERITY[worst]) worst = r.verdict;
      }
    });
    return { done: done, total: list.length, worst: worst };
  }

  function verdictLabel(key) {
    for (var i = 0; i < VERDICTS.length; i++) if (VERDICTS[i].key === key) return VERDICTS[i].label;
    return "Not yet";
  }

  function rollupChip(r) {
    if (r.done === r.total && r.worst) return '<span class="chip ' + r.worst + '">' + esc(verdictLabel(r.worst)) + "</span>";
    var tint = r.worst && SEVERITY[r.worst] >= 3 ? r.worst : "open";
    return '<span class="chip ' + tint + '">' + r.done + " of " + r.total + "</span>";
  }

  function renderFilter() {
    var select = document.getElementById("filter");
    var proposals = [];
    checks.forEach(function (c) {
      if (proposals.indexOf(c.proposal) < 0) proposals.push(c.proposal);
    });
    select.innerHTML = "";
    select.appendChild(el("option", { value: "", text: "All proposals (" + checks.length + " checks)" }));
    proposals.forEach(function (p) {
      var first = checks.filter(function (c) { return c.proposal === p; });
      select.appendChild(el("option", { value: p, text: p + ": " + first[0].proposalTitle + " (" + first.length + ")" }));
    });
    select.value = state.filter || "";
  }

  function renderList() {
    var nav = document.getElementById("list");
    nav.innerHTML = "";
    var list = visibleChecks();
    var groups = [];
    list.forEach(function (c) {
      var g = groups[groups.length - 1];
      if (!g || g.proposal !== c.proposal) groups.push(g = { proposal: c.proposal, title: c.proposalTitle, milestones: [] });
      var m = g.milestones[g.milestones.length - 1];
      if (!m || m.milestone !== c.milestone) g.milestones.push(m = { milestone: c.milestone, title: c.milestoneTitle, checks: [] });
      m.checks.push(c);
    });

    groups.forEach(function (g) {
      var box = el("div", { class: "group" });
      box.appendChild(el("div", { class: "group-title" }, esc(g.proposal + ": " + g.title)));
      g.milestones.forEach(function (m) {
        box.appendChild(el("div", { class: "milestone" },
          "<span>" + esc(m.milestone + ": " + m.title) + "</span>" + rollupChip(rollup(m.checks))));
        m.checks.forEach(function (c) {
          var r = resultOf(c.id);
          var item = el("button", {
            type: "button", class: "item", "aria-current": String(c.id === currentId),
            onclick: function () { show(c.id); }
          }, '<span class="dot ' + (r && r.verdict ? r.verdict : "") + '" aria-label="' +
             esc(verdictLabel(r && r.verdict)) + '"></span><span>' + esc(c.title) + "</span>");
          box.appendChild(item);
        });
      });
      nav.appendChild(box);
    });

    var all = rollup(list);
    var counts = { pass: 0, changes: 0, fail: 0, blocked: 0 };
    list.forEach(function (c) { var r = resultOf(c.id); if (r && r.verdict) counts[r.verdict]++; });
    document.getElementById("progress").textContent =
      all.done + " of " + all.total + " recorded: " + counts.pass + " pass, " + counts.changes + " with changes, " +
      counts.fail + " fail, " + counts.blocked + " couldn't run";
    var bar = document.getElementById("bar");
    bar.innerHTML = "";
    ["pass", "changes", "fail", "blocked"].forEach(function (k) {
      if (!counts[k] || !all.total) return;
      var seg = el("span");
      seg.style.width = (100 * counts[k] / all.total) + "%";
      seg.style.background = "var(--" + k + ")";
      bar.appendChild(seg);
    });
  }

  function renderStamp() {
    var s = currentId ? latestStamp(currentId) : null;
    var text;
    if (s) text = "Build for this check: " + stampText(s);
    else if (stamps.length) text = "No launch of this check stamped yet. Latest build: " + stampText(stamps[stamps.length - 1]);
    else text = "No build stamped yet. Launch with scripts/launch.sh, then reload the stamp.";
    document.getElementById("stamp").textContent = text;
  }

  function section(title, node) {
    var frag = document.createDocumentFragment();
    frag.appendChild(el("h3", { text: title }));
    frag.appendChild(node);
    return frag;
  }

  function listNode(tag, items) {
    var node = el(tag);
    items.forEach(function (t) { node.appendChild(el("li", {}, inline(t))); });
    return node;
  }

  function ensureResult(id) {
    var c = byId[id];
    if (!state.results[id]) {
      state.results[id] = { verdict: null, notes: "", failedStep: null, seen: c.expected.map(function () { return false; }),
                            screenshots: [], stamp: null, updated: null };
    }
    return state.results[id];
  }

  function touch(id) {
    var r = ensureResult(id);
    r.updated = new Date().toISOString();
    var s = latestStamp(id);
    if (s) r.stamp = s;
    save();
  }

  function show(id) {
    currentId = id;
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    renderList();
    renderStamp();

    var c = byId[id];
    var view = document.getElementById("view");
    view.innerHTML = "";
    var box = el("div", { class: "content" });

    var meta = el("div", { class: "meta" });
    meta.innerHTML = esc(c.proposal + " " + c.milestone + ": " + c.milestoneTitle) +
      (c.status === "partial" ? ' <span class="chip changes">partly checked before</span>' : "");
    box.appendChild(meta);
    box.appendChild(el("h2", { text: c.title }));

    var needs = el("div", { class: "meta" });
    needs.innerHTML = "<span>Needs:</span>" + (c.needs.length
      ? c.needs.map(function (n) { return '<span class="chip need">' + esc(NEED_LABELS[n] || n) + "</span>"; }).join(" ")
      : '<span class="chip need">nothing beyond a Mac</span>') +
      '<span>Launch:</span><span class="chip need">' + esc(LAUNCH_LABELS[c.launch] || c.launch) + "</span>";
    box.appendChild(needs);

    box.appendChild(section("Goal", el("p", {}, inline(c.goal))));

    if (c.notes) box.appendChild(section("Notes", el("div", { class: "notes-box" }, inline(c.notes))));

    var setup = el("div");
    if (c.setup.length) setup.appendChild(listNode("ol", c.setup)); else setup.appendChild(el("p", { text: "None." }));
    if (c.launch !== "none") {
      var cmd = launchCommand(c.id);
      var launch = el("div", { class: "launch" });
      launch.appendChild(el("code", { text: cmd }));
      launch.appendChild(el("button", { type: "button", onclick: function () { copy(cmd, "Launch command copied. Run it from the uniterm checkout's root."); } }, "Copy"));
      setup.appendChild(launch);
      setup.appendChild(el("p", { class: "hint", text: "Run the launch command from the root of your uniterm checkout. It builds, stamps the build, and starts the app." }));
    }
    box.appendChild(section("Setup", setup));

    box.appendChild(section("Steps", listNode("ol", c.steps)));

    var r = resultOf(id);
    var expected = el("div", { class: "expected" });
    c.expected.forEach(function (t, i) {
      var label = el("label");
      var cb = el("input", { type: "checkbox" });
      cb.checked = !!(r && r.seen && r.seen[i]);
      cb.addEventListener("change", function () { ensureResult(id).seen[i] = cb.checked; touch(id); });
      label.appendChild(cb);
      label.appendChild(el("span", {}, inline(t)));
      expected.appendChild(label);
    });
    box.appendChild(section("Expected: tick what you saw", expected));

    if (c.cleanup && c.cleanup.length) box.appendChild(section("Cleanup", listNode("ol", c.cleanup)));

    box.appendChild(verdictPanel(c));

    var nav = el("div", { class: "nav" });
    var list = visibleChecks();
    var at = list.indexOf(c);
    var prev = el("button", { type: "button", onclick: function () { show(list[at - 1].id); } }, "Previous");
    var next = el("button", { type: "button", onclick: function () { show(list[at + 1].id); } }, "Next");
    prev.disabled = at <= 0;
    next.disabled = at < 0 || at >= list.length - 1;
    nav.appendChild(prev);
    nav.appendChild(next);
    box.appendChild(nav);

    view.appendChild(box);
    view.parentNode.scrollTop = 0;
  }

  function verdictPanel(c) {
    var id = c.id;
    var r = resultOf(id);
    var panel = el("section", { class: "verdict", "aria-label": "Verdict" });
    panel.appendChild(el("strong", { text: "Your verdict" }));

    var buttons = el("div", { class: "verdicts", role: "group", "aria-label": "Verdict" });
    VERDICTS.forEach(function (v) {
      var b = el("button", { type: "button", class: v.key, title: v.help, "aria-pressed": String(!!(r && r.verdict === v.key)) }, esc(v.label));
      b.addEventListener("click", function () {
        var res = ensureResult(id);
        res.verdict = res.verdict === v.key ? null : v.key;
        if (res.verdict !== "fail") res.failedStep = null;
        touch(id);
        show(id);
        if (res.verdict && res.verdict !== "pass") {
          var area = document.getElementById("notes");
          if (area) area.focus();
        }
      });
      buttons.appendChild(b);
    });
    panel.appendChild(buttons);

    var verdict = r && r.verdict;
    if (verdict === "fail") {
      var row = el("div", { class: "row" });
      row.appendChild(el("label", { for: "failed-step", text: "Step that failed" }));
      var select = el("select", { id: "failed-step" });
      select.appendChild(el("option", { value: "", text: "Not tied to one step" }));
      c.steps.forEach(function (s, i) {
        var text = s.replace(/[`*]/g, "");
        select.appendChild(el("option", { value: String(i + 1), text: (i + 1) + ". " + (text.length > 70 ? text.slice(0, 70) + "..." : text) }));
      });
      select.value = r.failedStep ? String(r.failedStep) : "";
      select.addEventListener("change", function () { ensureResult(id).failedStep = select.value ? Number(select.value) : null; touch(id); });
      row.appendChild(select);
      panel.appendChild(row);
    }

    var prompts = {
      pass: "Anything worth noting, optional.",
      changes: "What would you change, and why?",
      fail: "What happened, and what did you expect instead?",
      blocked: "What stopped you: missing hardware, a setup error, or something else?"
    };
    var notes = el("textarea", { id: "notes", placeholder: prompts[verdict] || "Notes, optional until you pick a verdict." });
    notes.value = (r && r.notes) || "";
    notes.addEventListener("input", function () { ensureResult(id).notes = notes.value; touch(id); renderWarnings(); });
    panel.appendChild(notes);

    var warnings = el("div", { class: "warn", id: "verdict-warn" });
    panel.appendChild(warnings);

    var shots = el("div", { class: "shots" });
    ((r && r.screenshots) || []).forEach(function (s, i) {
      var wrap = el("div", { class: "shot" });
      wrap.appendChild(el("img", { src: s.dataUrl, alt: "Screenshot " + (i + 1) + ": " + s.name }));
      wrap.appendChild(el("button", { type: "button", "aria-label": "Remove screenshot " + (i + 1), onclick: function () {
        ensureResult(id).screenshots.splice(i, 1); touch(id); show(id);
      } }, "×"));
      shots.appendChild(wrap);
    });
    panel.appendChild(shots);

    var drop = el("div", { class: "drop" },
      "Drop or paste a screenshot here, or <button type=\"button\" id=\"pick-shot\">Choose a file</button>. " +
      "Capture only uniterm's window: Cmd-Shift-4, then Space, then click the window.");
    var picker = el("input", { type: "file", accept: "image/*", multiple: "multiple", hidden: "hidden" });
    picker.addEventListener("change", function () { addShots(id, picker.files); });
    drop.appendChild(picker);
    drop.querySelector("#pick-shot").addEventListener("click", function () { picker.click(); });
    drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
    drop.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); addShots(id, e.dataTransfer.files); });
    panel.appendChild(drop);

    var stampNote = el("div", { class: "hint" });
    if (r && r.stamp) stampNote.textContent = "Recorded against " + stampText(r.stamp) + ".";
    else if (c.launch !== "none") stampNote.textContent = "No build stamp for this check yet. Launch it with the command above, then press Reload stamp.";
    panel.appendChild(stampNote);

    setTimeout(renderWarnings, 0);
    return panel;
  }

  function renderWarnings() {
    var box = document.getElementById("verdict-warn");
    if (!box || !currentId) return;
    var r = resultOf(currentId);
    var c = byId[currentId];
    var lines = [];
    if (r && r.verdict && r.verdict !== "pass" && !r.notes.trim()) lines.push("Add a note so the reader knows what to change or fix.");
    if (r && r.verdict === "pass" && r.seen && r.seen.some(function (x) { return !x; })) lines.push("Some expected results are not ticked. Tick them, or say in a note why they did not apply.");
    if (r && r.verdict && !r.stamp && c.launch !== "none") lines.push("This verdict has no build stamp.");
    box.textContent = lines.join(" ");
  }

  document.addEventListener("paste", function (e) {
    if (!currentId || !e.clipboardData) return;
    var files = [];
    for (var i = 0; i < e.clipboardData.items.length; i++) {
      var item = e.clipboardData.items[i];
      if (item.kind === "file" && item.type.indexOf("image/") === 0) files.push(item.getAsFile());
    }
    if (files.length) { e.preventDefault(); addShots(currentId, files); }
  });

  // Screenshots are scaled to at most 1600 px on the long side and stored as JPEG, so a few dozen fit in
  // the page's local storage and in the exported file.
  function addShots(id, files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return f && f.type.indexOf("image/") === 0; });
    if (!list.length) return;
    var pending = list.length;
    list.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          ensureResult(id).screenshots.push({ name: file.name || "pasted.png", width: canvas.width, height: canvas.height,
                                              dataUrl: canvas.toDataURL("image/jpeg", 0.82) });
          if (--pending === 0) { touch(id); if (currentId === id) show(id); }
        };
        img.onerror = function () { if (--pending === 0) { touch(id); show(id); } toast("Could not read " + file.name + "."); };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function copy(text, message) {
    var done = function () { toast(message); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }

  function fallbackCopy(text) {
    var area = el("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); } catch (e) { /* the toast still shows the command was offered */ }
    document.body.removeChild(area);
  }

  function slug(s) { return String(s || "tester").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "tester"; }

  function exportResults() {
    var list = visibleChecks();
    var results = list.filter(function (c) { var r = resultOf(c.id); return r && (r.verdict || r.notes || r.screenshots.length); })
      .map(function (c) {
        var r = resultOf(c.id);
        return {
          id: c.id, proposal: c.proposal, milestone: c.milestone, title: c.title,
          verdict: r.verdict, failedStep: r.failedStep, notes: r.notes,
          expected: c.expected.map(function (t, i) { return { text: t, seen: !!(r.seen && r.seen[i]) }; }),
          stamp: r.stamp, updated: r.updated, screenshots: r.screenshots
        };
      });
    if (!results.length) { toast("Nothing recorded yet for " + (state.filter || "any proposal") + "."); return; }
    var doc = {
      format: "uniterm-hand-check-results", version: 1, tester: state.tester || "",
      scope: state.filter || "all", exportedAt: new Date().toISOString(),
      checksInScope: list.map(function (c) { return c.id; }), results: results
    };
    var blob = new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" });
    var a = el("a", { href: URL.createObjectURL(blob),
      download: "results-" + slug(state.tester) + "-" + slug(state.filter || "all") + "-" + new Date().toISOString().slice(0, 10) + ".json" });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Exported " + results.length + " results. Send that file back.");
  }

  function importResults(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var doc;
      try { doc = JSON.parse(reader.result); } catch (e) { toast("That file is not JSON."); return; }
      if (!doc || doc.format !== "uniterm-hand-check-results" || !Array.isArray(doc.results)) {
        toast("That file is not an export from this runner."); return;
      }
      var taken = 0, kept = 0, unknown = 0;
      doc.results.forEach(function (x) {
        var c = byId[x.id];
        if (!c) { unknown++; return; }
        var local = resultOf(x.id);
        if (local && local.updated && x.updated && local.updated >= x.updated) { kept++; return; }
        state.results[x.id] = {
          verdict: x.verdict || null, notes: x.notes || "", failedStep: x.failedStep || null,
          seen: c.expected.map(function (t, i) { return !!(x.expected && x.expected[i] && x.expected[i].seen); }),
          screenshots: x.screenshots || [], stamp: x.stamp || null, updated: x.updated || new Date().toISOString()
        };
        taken++;
      });
      if (!state.tester && doc.tester) { state.tester = doc.tester; document.getElementById("tester").value = doc.tester; }
      save();
      renderList();
      if (currentId) show(currentId);
      toast("Imported " + taken + ". Kept " + kept + " newer local results." + (unknown ? " Skipped " + unknown + " unknown checks." : ""));
    };
    reader.readAsText(file);
  }

  function showSummary() {
    currentId = null;
    history.replaceState(null, "", "#summary");
    renderList();
    renderStamp();
    var lines = ["# Hand-check results" + (state.filter ? ": " + state.filter : ""), "",
                 "Tester: " + (state.tester || "(no name)") + ". Written " + new Date().toISOString().slice(0, 10) + ".", ""];
    var proposal = null, milestone = null;
    visibleChecks().forEach(function (c) {
      if (c.proposal !== proposal) { proposal = c.proposal; milestone = null; lines.push("## " + c.proposal + ": " + c.proposalTitle, ""); }
      if (c.milestone !== milestone) {
        milestone = c.milestone;
        var group = visibleChecks().filter(function (x) { return x.proposal === c.proposal && x.milestone === c.milestone; });
        var r = rollup(group);
        lines.push("### " + c.milestone + ": " + c.milestoneTitle + " (" +
          (r.done === r.total && r.worst ? verdictLabel(r.worst) : r.done + " of " + r.total + " recorded") + ")", "");
      }
      var res = resultOf(c.id);
      var v = res && res.verdict ? verdictLabel(res.verdict) : "Not yet";
      var line = "- " + v + ": " + c.title;
      if (res && res.failedStep) line += " (step " + res.failedStep + ")";
      if (res && res.stamp) line += " [" + res.stamp.commit.slice(0, 12) + "]";
      lines.push(line);
      if (res && res.notes.trim()) res.notes.trim().split("\n").forEach(function (n) { lines.push("  > " + n); });
      if (res && res.screenshots.length) lines.push("  > " + res.screenshots.length + " screenshot(s) in the export.");
    });
    lines.push("");
    var text = lines.join("\n");

    var view = document.getElementById("view");
    view.innerHTML = "";
    var box = el("div", { class: "content summary" });
    box.appendChild(el("h2", { text: "Summary" }));
    box.appendChild(el("p", { class: "hint", text: "A readable digest for a chat or an email. The exported JSON file is the full record, with screenshots." }));
    var area = el("textarea", { readonly: "readonly", "aria-label": "Summary" });
    area.value = text;
    box.appendChild(area);
    box.appendChild(el("p", {}, ""));
    box.lastChild.appendChild(el("button", { type: "button", onclick: function () { copy(text, "Summary copied."); } }, "Copy summary"));
    view.appendChild(box);
  }

  function emptyView() {
    var view = document.getElementById("view");
    view.innerHTML = "";
    view.appendChild(el("div", { class: "empty" }, checks.length
      ? "Pick a check on the left. Start by entering your name and choosing your assigned proposal."
      : "No checks loaded. checks.js is missing or empty: run <code>python3 tools/build.py</code> in this folder."));
  }

  document.getElementById("tester").value = state.tester || "";
  document.getElementById("tester").addEventListener("input", function (e) { state.tester = e.target.value; save(); });
  document.getElementById("filter").addEventListener("change", function (e) {
    state.filter = e.target.value;
    save();
    var list = visibleChecks();
    if (currentId && list.indexOf(byId[currentId]) < 0) { currentId = null; }
    if (currentId) show(currentId); else if (list.length) show(list[0].id); else { renderList(); emptyView(); }
  });
  document.getElementById("reload").addEventListener("click", function () { location.reload(); });
  document.getElementById("export").addEventListener("click", exportResults);
  document.getElementById("summary").addEventListener("click", showSummary);
  document.getElementById("import").addEventListener("click", function () { document.getElementById("import-file").click(); });
  document.getElementById("import-file").addEventListener("change", function (e) {
    if (e.target.files[0]) importResults(e.target.files[0]);
    e.target.value = "";
  });

  renderFilter();
  var start = location.hash.slice(1);
  if (start === "summary") showSummary();
  else if (byId[start]) show(start);
  else { renderList(); renderStamp(); emptyView(); }
})();
</script>
</body>
</html>
