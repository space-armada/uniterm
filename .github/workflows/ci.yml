name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The tested-tree check reads which PR a push merged and that PR's ci check.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
      tested: ${{ steps.tested.outputs.tested || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI gating
        run: make test-ci

      - name: Detect build inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make ci-changes

      - name: Look for a merged PR that passed this tree
        id: tested
        if: github.event_name == 'push' && steps.changes.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: make ci-tested-tree

  # The three macOS jobs run side by side. The package job runs the package tests and the helper
  # sandbox checks. The app job runs three UI test shards in parallel. A push whose tree a merged PR
  # already passed skips the package and app jobs.
  package:
    needs: changes
    if: needs.changes.outputs.build_required == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: make ci-package
        run: make ci-package

  app:
    needs: changes
    if: needs.changes.outputs.build_required == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: macos-26
    # Job timeout accounts for: setup up to 5 min, then the test step, build included, up to 38 min, then collection up to 2 min and upload up to 5 min, for 50 min
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/macos-setup

      - name: Shard ${{ strategy.job-index }} of ${{ strategy.job-total }}
        id: test
        timeout-minutes: 38
        run: make test-app-shard SHARD=${{ strategy.job-index }} SHARDS=${{ strategy.job-total }}

      - name: Collect kept log if test step did not complete
        if: always() && steps.test.outcome != 'success' && steps.test.outcome != 'skipped'
        run: |
          # A test step that ran to its end already collected its log. Only a step its timeout stopped has none.
          if [[ -f ".build/DerivedData-test/ui-test-kept-log-shard-${{ strategy.job-index }}.txt.gz" ]]; then
            echo "The test step already kept its log, skipping kept log collection"
            exit 0
          fi

          if [[ -f .build/DerivedData-test/ui-test-start-time.txt ]]; then
            start_time=$(cat .build/DerivedData-test/ui-test-start-time.txt)
            scripts/collect-ui-test-log.sh "$start_time" ".build/DerivedData-test/ui-test-kept-log-shard-${{ strategy.job-index }}.txt.gz"
          else
            echo "No start time recorded, skipping kept log collection"
          fi

      - name: Keep the UI test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results-shard-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: |
            .build/DerivedData-test/Logs/Test/*.xcresult
            .build/DerivedData-test/ui-test-kept-log-shard-*.txt.gz
          retention-days: 7
          if-no-files-found: ignore

  # The offline rebuild proves the pinned Ghostty rebuilds with the network off. Its result depends
  # only on the files and the runner image that the proof key names. Once a run proves a key, later
  # runs with the same key end early. A pull request reads the keys that main saved.
  ghostty-offline:
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name what the rebuild depends on
        id: proof
        run: scripts/ghostty-proof-key.sh

      - name: Look for an earlier proof
        id: earlier
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty-offline-proof
          key: ${{ steps.proof.outputs.key }}
          lookup-only: true

      # Only main's runs save the Ghostty cache that pull requests read. A push whose tree a merged PR
      # already passed skips the package and app jobs, so this job rebuilds when that cache is gone,
      # and the setup action saves it again. GitHub evicts a cache that no run read for a week.
      - name: Look for main's Ghostty cache
        id: ghostty-cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty
          # The macOS setup action's Ghostty cache key. make test-ci checks that the two agree.
          key: ghostty-${{ runner.arch }}-${{ hashFiles('ghostty.pin', 'ThirdParty/ghostty-patches/*.patch') }}
          lookup-only: true

      - name: Report the earlier proof
        if: steps.earlier.outputs.cache-hit == 'true' && !(github.event_name == 'push' && steps.ghostty-cache.outputs.cache-hit != 'true')
        run: echo "An earlier run proved ${{ steps.proof.outputs.key }}, so the rebuild is skipped."

      - if: steps.earlier.outputs.cache-hit != 'true' || (github.event_name == 'push' && steps.ghostty-cache.outputs.cache-hit != 'true')
        uses: ./.github/actions/macos-setup

      - name: make ghostty-offline-check
        if: steps.earlier.outputs.cache-hit != 'true' || (github.event_name == 'push' && steps.ghostty-cache.outputs.cache-hit != 'true')
        run: make ghostty-offline-check

      - name: Record the proof
        if: steps.earlier.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/ghostty-offline-proof
          echo "${{ steps.proof.outputs.key }}" >.cache/ghostty-offline-proof/key

      - if: steps.earlier.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ghostty-offline-proof
          key: ${{ steps.proof.outputs.key }}

  # Keep the required check present even when macOS jobs are intentionally skipped or fail.
  ci:
    needs: [changes, package, app, ghostty-offline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the expected job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build_required }}
          TESTED: ${{ needs.changes.outputs.tested }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          APP_RESULT: ${{ needs.app.result }}
          GHOSTTY_OFFLINE_RESULT: ${{ needs.ghostty-offline.result }}
        run: make ci-result
